[project]
name = "r2b"
version = "0.1.0"
description = "Python side of r2b: Replica skill scripts and REA bridge helpers."
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/replica/tests", "src/rea/bridge"]
pythonpath = ["src/replica/tests", "src/rea"]
addopts = "--import-mode=importlib"
